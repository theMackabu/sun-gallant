name: Build

on:
  push:
    branches: ['master']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: sun-gallant
          path: |
            dist/SunGallant-Regular.ttf
            dist/SunGallant-Regular.woff2
            LICENSE
            THIRD_PARTY_NOTICES.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: font
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun-gallant
          path: release
      - run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
