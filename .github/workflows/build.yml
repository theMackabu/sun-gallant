name: Build

on:
  push:
    branches: ['master']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: make test
      - uses: actions/upload-artifact@v7
        with:
          name: sun-gallant
          path: |
            dist/SunGallant-Regular.ttf
            dist/SunGallant-Regular.woff2
            dist/SunGallantClassic-Regular.ttf
            dist/SunGallantClassic-Regular.woff2
            LICENSE
            THIRD_PARTY_NOTICES.md

  release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: font
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sun-gallant
          path: release
      - run: |
          mapfile -d '' assets < <(find release -type f -print0 | sort -z)
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
